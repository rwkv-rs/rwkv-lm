[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lm"
version = "0.1.0"
description = "RWKV language-model training components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flash-linear-attention[cuda,flash-rwkv] @ git+https://github.com/rwkv-rs/fla-rwkv.git@88e8ff9d29dcebadb89ebad62ee76951729ea0df",
    "flash-rwkv @ git+https://github.com/rwkv-rs/FlashRWKV.git@c637985558c398de1db6a3c0523b1eec206a88d4",
    "numpy>=2.0.0",
    "torch",
    "torchtitan @ git+https://github.com/pytorch/torchtitan.git@681fd4b509b183ba33f70d39580b848b36e66ca5",
    "transformers @ git+https://github.com/rwkv-rs/transformers-rwkv.git@2696927df9363b5fa175076bb827ba4da2c4e581",
    "wandb",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.0",
]

[project.scripts]
rwkv-convert-legacy-checkpoint = "transformers.models.rwkv7.convert_rwkv7_checkpoint_to_hf:main"
rwkv-train = "torchtitan.train:main"

[tool.setuptools.packages.find]
where = ["src"]
