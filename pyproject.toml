[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lm"
version = "0.1.0"
description = "RWKV language-model training components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepspeed",
    "ninja",
    "numpy>=2.0.0",
    "pytorch-lightning==1.9.5",
    "torch",
    "wandb",
]

[project.scripts]
rwkv-train = "rwkv_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rwkv_lm = ["cuda/*.cpp", "cuda/*.cu"]
