[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lm"
version = "0.1.0"
description = "RWKV language-model training components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flash-linear-attention[cuda] @ git+https://github.com/rwkv-rs/fla-rwkv.git@1bc262c8c81241e1d339419a31f0aadffa20c210",
    "flash-rwkv @ git+https://github.com/rwkv-rs/FlashRWKV.git@866aafd2eed146b0eda1ce03444009ae030f89e3",
    "numpy>=2.0.0",
    "torch",
    "transformers @ git+https://github.com/rwkv-rs/transformers-rwkv.git@eb8248eb9083288e7769518077a1be9c0f7cf7b8",
    "wandb",
]

[project.scripts]
rwkv-convert-legacy-checkpoint = "rwkv_lm.standard_model:converter_main"
rwkv-train = "rwkv_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
