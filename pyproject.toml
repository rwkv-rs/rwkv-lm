[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lm"
version = "0.1.0"
description = "RWKV language-model training components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flash-linear-attention[cuda,flash-rwkv] @ git+https://github.com/rwkv-rs/fla-rwkv.git@a4a8aa98df6ec5322f194a80ec57363dd045adfc",
    "flash-rwkv @ git+https://github.com/rwkv-rs/FlashRWKV.git@866aafd2eed146b0eda1ce03444009ae030f89e3",
    "numpy>=2.0.0",
    "torch",
    "transformers @ git+https://github.com/rwkv-rs/transformers-rwkv.git@2696927df9363b5fa175076bb827ba4da2c4e581",
    "wandb",
]

[project.scripts]
rwkv-convert-legacy-checkpoint = "rwkv_lm.standard_model:converter_main"
rwkv-train = "rwkv_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
