[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-lm"
version = "0.1.0"
description = "RWKV language-model training components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "torch",
    "wandb",
]

[project.scripts]
rwkv-convert-legacy-checkpoint = "rwkv_lm.standard_model:converter_main"
rwkv-train = "rwkv_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
